# Kernel settings that Kubernetes needs.
#   overlay: a file system that containerd uses for container images.
#   br_netfilter: lets the firewall (iptables) see traffic between pods.
# Above each task, "Manual:" shows the command that does the same thing by hand.
---
# Manual:
#   cat <<EOF | sudo tee /etc/modules-load.d/k8s.conf
#   overlay
#   br_netfilter
#   EOF
- name: Load overlay and br_netfilter on every boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"

# Manual:
#   sudo modprobe overlay
#   sudo modprobe br_netfilter
- name: Load overlay and br_netfilter now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

# Manual:
#   cat <<EOF | sudo tee /etc/sysctl.d/k8s.conf
#   net.bridge.bridge-nf-call-iptables  = 1
#   net.bridge.bridge-nf-call-ip6tables = 1
#   net.ipv4.ip_forward                 = 1
#   EOF
- name: Enable IPv4 packet forwarding for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    owner: root
    group: root
    mode: "0644"

# Manual:
#   sudo sysctl --system
#   sysctl net.ipv4.ip_forward      # check: it should show "= 1"
- name: Apply sysctl params without reboot
  ansible.builtin.command: sysctl --system
  changed_when: false
