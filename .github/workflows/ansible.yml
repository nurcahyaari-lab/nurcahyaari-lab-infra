name: Ansible Deploy

# push to main that touches ansible/ -> works out which playbooks the change affects
#                                       (.github/scripts/ansible-changed-playbooks.sh),
#                                       waits for approval, then runs only those
# manual run (Actions tab)           -> pick a playbook, optionally dry-run with --check
on:
  push:
    branches:
      - main
    paths:
      - ansible/**
      - .github/workflows/ansible.yml
  workflow_dispatch:
    inputs:
      playbook:
        description: Playbook to run
        type: choice
        default: site.yaml
        options:
          - site.yaml
          - common.yaml
          - k8s_prerequisite.yaml
          - container_runtime.yaml
          - k8s_init.yaml
          - k8s_cluster.yaml
          - tailscale_subnetting.yaml
          - monitoring.yaml
          - adguardhome.yaml
      limit:
        description: Only run on these hosts (ansible --limit), empty = all
        type: string
        default: ""
      check:
        description: Dry run (--check --diff)
        type: boolean
        default: false

concurrency:
  group: ansible
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # No environment here, so it runs without approval. If nothing needs to run,
  # the deploy job is skipped and no approval is requested.
  plan:
    name: Pick playbooks
    runs-on: ubuntu-latest
    outputs:
      playbooks: ${{ steps.pick.outputs.playbooks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick playbooks
        id: pick
        working-directory: ansible
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PLAYBOOK: ${{ inputs.playbook }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            playbooks=$INPUT_PLAYBOOK
          else
            playbooks=$(../.github/scripts/ansible-changed-playbooks.sh "$BASE" "$HEAD" | tr '\n' ' ')
          fi
          echo "Playbooks to run: ${playbooks:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "playbooks=$playbooks" >> "$GITHUB_OUTPUT"

  deploy:
    name: Ansible Playbook Deploy
    needs: plan
    if: needs.plan.outputs.playbooks != ''
    runs-on: ubuntu-latest
    environment: homelab
    defaults:
      run:
        working-directory: ansible
    env:
      PLAYBOOKS: ${{ needs.plan.outputs.playbooks }}
      LIMIT: ${{ inputs.limit }}
      CHECK: ${{ inputs.check && 'true' || 'false' }}
      ANSIBLE_FORCE_COLOR: "true"
      ANSIBLE_VAULT_PASSWORD_FILE: ${{ github.workspace }}/.vault-pass
      MONITORING_CONFIG_DIR: ${{ github.workspace }}/manifests/monitoring/config
    steps:
      - uses: actions/checkout@v7

      - name: Check out the manifests repo (monitoring config)
        uses: actions/checkout@v7
        with:
          repository: nurcahyaari-lab/nurcahyaari-lab-manifests
          path: manifests

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          ping: 100.116.185.117

      - name: Set up SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/homelab
          chmod 600 ~/.ssh/homelab
          cat > ~/.ssh/config <<'EOF'
          Host pve
            HostName 192.168.1.5
            User root
            IdentityFile ~/.ssh/homelab
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Write vault password
        run: |
          printf '%s' "$VAULT_PASS" > "$ANSIBLE_VAULT_PASSWORD_FILE"
          chmod 600 "$ANSIBLE_VAULT_PASSWORD_FILE"
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: |
          pip install ansible-core
          ansible-galaxy collection install -r requirements.yaml

      - name: Ping all the hosts
        run: ansible all -m ping

      - name: Run playbook
        run: |
          read -ra books <<< "$PLAYBOOKS"
          args=("${books[@]/#/playbooks/}")
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          [ "$CHECK" = "true" ] && args+=(--check --diff)
          ansible-playbook "${args[@]}"
