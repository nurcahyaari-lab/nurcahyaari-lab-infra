# WHICH machines exist and how they are grouped. Nothing about what to install goes here.
#
# Host names must match the VM names in infra/terraform.tfvars (they become the hostnames),
# and ansible_host must match each VM's IP there.
# Variables per group live in group_vars/<group>.yaml next to this file.
[all]
k8s-cp ansible_host=192.168.1.21
k8s-worker ansible_host=192.168.1.22
monitoring ansible_host=192.168.1.23

[k8s]
k8s-cp ansible_host=192.168.1.21
k8s-worker ansible_host=192.168.1.22

[control_plane]
k8s-cp ansible_host=192.168.1.21

[worker]
k8s-worker ansible_host=192.168.1.22

[monitoring]
monitoring ansible_host=192.168.1.23