# Applies to every machine in the inventory.
ansible_user: ubuntu # created by cloud-init in infra/proxmox/vms.tf
ansible_ssh_private_key_file: ~/.ssh/homelab # private half of var.ssh_public_key

# The VMs are only reachable from the Proxmox host's LAN, so hop through it first.
# Same as `ssh -J pve ubuntu@<ip>`; "pve" is the Host entry in ~/.ssh/config.
ansible_ssh_common_args: -J pve

# Python on the VMs that Ansible uses to run its modules (Ubuntu's system Python).
ansible_python_interpreter: /usr/bin/python3
