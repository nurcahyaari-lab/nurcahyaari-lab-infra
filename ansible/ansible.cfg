# Ansible settings for this project.
# Run all ansible commands from this folder, so Ansible uses this file.
[defaults]
inventory = inventory/hosts.ini
roles_path = roles
# Do not check SSH host keys. The keys change every time a VM is rebuilt.
host_key_checking = False
# Over Tailscale from outside, one ssh through pve can take 10-20s. The default (10s) is too short.
timeout = 60
# Show the output in a format that is easy to read.
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
