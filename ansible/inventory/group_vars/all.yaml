# Settings for all machines.

# The user that Ansible logs in as. cloud-init creates it (see infra/proxmox/vms.tf).
ansible_user: ubuntu
# The SSH key for that user.
ansible_ssh_private_key_file: ~/.ssh/homelab

# You can only reach the VMs through the Proxmox host.
# This is the same as: ssh -J pve ubuntu@<ip>
# "pve" is defined in ~/.ssh/config.
ansible_ssh_common_args: -J pve

# The Python program on the VMs that Ansible uses.
ansible_python_interpreter: /usr/bin/python3

process_exporter_version: 0.8.7