# The list of machines and their groups.
# Only put machines here. Settings go in group_vars/<group name>.yaml.
#
# The names must be the same as the VM names in infra/terraform.tfvars.
# The IPs must be the same as the VM IPs there.
[all]
k8s-cp ansible_host=192.168.1.21
k8s-worker ansible_host=192.168.1.22
monitoring ansible_host=192.168.1.23

[k8s]
k8s-cp ansible_host=192.168.1.21
k8s-worker ansible_host=192.168.1.22

[control_plane]
k8s-cp ansible_host=192.168.1.21

[worker]
k8s-worker ansible_host=192.168.1.22

[monitoring]
monitoring ansible_host=192.168.1.23

[proxmox]
pve ansible_host=192.168.1.5 ansible_user=root