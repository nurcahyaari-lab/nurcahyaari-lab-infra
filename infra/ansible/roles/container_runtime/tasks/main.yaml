# Installs and sets up containerd. Kubernetes uses containerd to run containers.
# Above each task, "Manual:" shows the command that does the same thing by hand.
---
# Manual:
#   sudo apt-get update
#   sudo apt-get install -y containerd
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true

# Manual:
#   sudo mkdir -p /etc/containerd
- name: Create /etc/containerd directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

# Manual (only if the file does not exist yet):
#   containerd config default | sudo tee /etc/containerd/config.toml
- name: Generate default containerd configuration
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml
  notify: Restart containerd

# Manual:
#   sudo sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
#   grep SystemdCgroup /etc/containerd/config.toml     # check: it should show "SystemdCgroup = true"
- name: Switch containerd to systemd cgroup driver
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

# Manual:
#   sudo systemctl enable --now containerd
- name: Start containerd and enable it on boot
  ansible.builtin.systemd_service:
    name: containerd
    state: started
    enabled: true

# If a task above changed the config, restart containerd now (see handlers/main.yaml).
# Manual (only after you change config.toml):
#   sudo systemctl restart containerd
- name: Apply containerd config changes now
  ansible.builtin.meta: flush_handlers
