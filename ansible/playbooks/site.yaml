# Runs all playbooks in order. Use it to set up new VMs from the start.
# Run it with:
#   ansible-playbook playbooks/site.yaml
#
# When you add a new playbook, add it to this list.
---
- name: Base setup for every machine
  ansible.builtin.import_playbook: common.yaml

- name: Prerequisites for Kubernetes networking modules
  ansible.builtin.import_playbook: k8s_prerequisite.yaml

- name: Install container runtime for Kubernetes
  ansible.builtin.import_playbook: container_runtime.yaml

- name: Install kubeadm, kubelet, and kubectl
  ansible.builtin.import_playbook: k8s_init.yaml

- name: Create Kubernetes cluster
  ansible.builtin.import_playbook: k8s_cluster.yaml

- name: Tailscale Subnetting
  ansible.builtin.import_playbook: tailscale_subnetting.yaml

- name: Setup monitoring tools
  ansible.builtin.import_playbook: monitoring.yaml
